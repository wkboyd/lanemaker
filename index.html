<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lanemaker.net has moved</title>
    <meta name="robots" content="noindex">
    <style>
        :root { --bg: #f8f9fa; --fg: #111827; --muted: #4b5563; --accent: #2563eb; }
        @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --accent: #60a5fa; } }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center; }
        main { max-width: 32rem; }
        h1 { margin: 0 0 .6rem; font-size: 1.6rem; line-height: 1.25; }
        p { margin: 0 0 1.2rem; color: var(--muted); font-size: 1.05rem; line-height: 1.5; }
        a.go { display: inline-block; padding: .65rem 1.3rem; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
        a.go:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>lanemaker.net has moved to lanesketch.net</h1>
        <p>The street and lane diagram tool now lives at its new address. Your bookmarks will need updating.</p>
        <a class="go" href="https://lanesketch.net">Go to lanesketch.net</a>
    </main>
</body>
</html>
